name: Publish to npm

# Publishes @ghostwire/presets when a GitHub Release is published. The release
# tag must be v<version> matching package.json, e.g. v1.0.0.
#
# Auth is npm **trusted publishing**: npm is configured with this repository and
# this workflow filename as a trusted publisher, and the CLI exchanges the OIDC
# token GitHub mints for a short-lived publish credential. That is what the
# id-token permission below is for, and it is why there is no NPM_TOKEN here —
# a long-lived token in a secret is the thing this replaces. It expired once and
# took a release with it.
#
# **Do not add NODE_AUTH_TOKEN back.** npm prefers a token when it finds one, so
# setting it silently returns this workflow to the credential it no longer has.
# Provenance comes free on this path; npm attaches it without the flag.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the OIDC token npm trades for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14. Node 24 is the
      # current LTS and ships npm 11.19; node 20's npm 10 cannot do the OIDC
      # exchange at all, which is why this moved.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match package.json version '${pkg}'." >&2
            echo "Tag the release v${pkg}, or bump package.json to match." >&2
            exit 1
          fi
          echo "Publishing version ${pkg}."

      - name: Validate that every preset and toolbox manifest is valid JSON
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" 2>/dev/null; then
              echo "invalid JSON: $f" >&2
              fail=1
            fi
          done < <(find agents toolboxes -name '*.json' -type f)
          [ "$fail" -eq 0 ] || exit 1

      - name: Publish
        run: npm publish
